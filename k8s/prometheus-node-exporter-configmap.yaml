apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: eduelevate
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'eduelevate-backend'
        static_configs:
          - targets: ['backend-service:4000']

      - job_name: 'node-exporter'
        static_configs:
          - targets: ['node-exporter:9100']

